# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# Replace the '❯' symbol in the prompt with '➜'
[character]
success_symbol = '[➜](bold green)'

[cmd_duration]
min_time = 5_000

[directory]
truncation_length = 5
truncation_symbol = '…/'
style = "bright-purple"

[hostname]
ssh_only = true
style = "pink"
