music_directory     "/mnt/grotto/music/library"
playlist_directory  "/mnt/grotto/music/mpd/playlists"

db_file   "/mnt/grotto/music/mpd/db"
bind_to_address "/mnt/grotto/music/mpd/socket"
bind_to_address "@mpd"

bind_to_address	"any"
port            "6600"

# {# replace_between(`"`, `@`, secrets::get("mpd")) #}
password "@read,add,player,control"
local_permissions "read,add,player,control,admin"

audio_output {
  type  "pipewire"
  name  "PipeWire Sound Server"
}

audio_output {
  type    "fifo"
  name    "my_fifo"
  path    "/tmp/mpd.fifo"
  format  "44100:16:2"
}

audio_output {
  type  "httpd"
  bind_to_address "any"
  port "6601"
  dscp_class "CS3"
  encoder "vorbis"
  name "apollo?"
}
